name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: [self-hosted, build, 8gb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run CPU tests
        run: pytest -q
